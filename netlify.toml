# Netlify: build the Vite app in web/ and serve web/dist
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# Serverless functions (visit counter), relative to base = "web"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"

# Data files change only when scripts/build_data.py is re-run and redeployed
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
